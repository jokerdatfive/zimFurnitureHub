<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="780" height="180">
  <defs>
    <linearGradient id="kk_terra_w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2785B"/>
      <stop offset="100%" stop-color="#C25537"/>
    </linearGradient>
  </defs>
  <!-- Sculptural Monogram (double K organic curved sofa) -->
  <g transform="translate(15, 10) scale(0.9)">
    <!-- Stem 1: White pillar -->
    <rect x="25" y="20" width="22" height="150" rx="11" fill="#FFFFFF"/>
    <!-- Sweeping Top Curve -->
    <path d="M 47 95 C 65 65, 105 35, 140 35 C 160 35, 170 48, 165 65 C 160 80, 140 95, 115 102 Z" fill="url(#kk_terra_w)"/>
    <!-- Ergonomic Lower Curve -->
    <path d="M 47 105 C 75 110, 115 125, 135 155 C 145 168, 138 175, 125 175 C 105 175, 80 155, 47 115 Z" fill="#FFFFFF"/>
    <!-- Stem 2 -->
    <rect x="110" y="45" width="20" height="125" rx="10" fill="#FFFFFF"/>
    <!-- Second K Sweeping Top Ribbon -->
    <path d="M 130 95 C 145 70, 175 48, 200 48 C 215 48, 222 58, 218 72 C 214 84, 195 98, 175 103 Z" fill="url(#kk_terra_w)"/>
    <!-- Second K Sweeping Lower Ribbon -->
    <path d="M 130 105 C 150 112, 185 128, 202 152 C 210 163, 204 172, 192 172 C 175 172, 155 155, 130 115 Z" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark: Kombera Kombera Furnitures -->
  <text x="240" y="78" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="46" fill="#FFFFFF" letter-spacing="1.5">KOMBERA KOMBERA</text>
  <text x="242" y="118" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="22" fill="#E2785B" letter-spacing="8">FURNITURES</text>
  <line x1="242" y1="135" x2="740" y2="135" stroke="#374151" stroke-width="1.5"/>
  <line x1="242" y1="135" x2="385" y2="135" stroke="#E2785B" stroke-width="2.5"/>
  <text x="242" y="156" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="11" fill="#9CA3AF" letter-spacing="6">CONTEMPORARY ORGANIC LIVING</text>
</svg>
